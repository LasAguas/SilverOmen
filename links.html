  <style>
    /* ===== Links Page ===== */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3.5rem 1.5rem 4rem;
      position: relative;
      overflow-x: hidden;
    }

    .links-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .links-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: blur(24px);
      transform: scale(1.06);
    }

    .links-bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 18, 0.72);
    }

    .links-bg-overlay-green {
      position: absolute;
      inset: 0;
      background: rgba(44, 137, 211, 0.15);
    }

    .links-page {
      position: relative;
      z-index: 1;
    }

    .links-page {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Artist name */
    .links-name {
      font-family: 'Protagonist', sans-serif;
      font-size: clamp(2rem, 8vw, 3rem);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 1.75rem;
    }

    /* Cover art */
    .links-cover {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 2.5rem;
      flex-shrink: 0;
    }

    .links-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Link buttons */
    .links-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 3rem;
    }

    .links-btn {
      display: block;
      width: 100%;
      padding: 1rem 1.5rem;
      text-align: center;
      font-family: 'Brans', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f8f8f8;
      border: 1px solid rgba(248, 248, 248, 0.25);
      border-radius: 4px;
      background: rgba(248, 248, 248, 0.05);
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .links-btn:hover {
      background: rgba(44, 137, 211, 0.18);
      border-color: #2C89D3;
      color: #f8f8f8;
    }

    .links-btn.links-btn-primary {
      background: #2C89D3;
      border-color: #2C89D3;
    }

    .links-btn.links-btn-primary:hover {
      background: #1F69A2;
      border-color: #1F69A2;
    }

    /* Expandable streaming panel */
    .links-expand-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .links-expand-btn .expand-arrow {
      display: inline-block;
      font-size: 0.6rem;
      transition: transform 0.25s ease;
      line-height: 1;
    }

    .links-expand-btn[aria-expanded="true"] .expand-arrow {
      transform: rotate(180deg);
    }

    .links-sub-buttons {
      display: none;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
      margin-top: 0.6rem;
      padding-left: 0.75rem;
    }

    .links-sub-buttons.open {
      display: flex;
    }

    .links-sub-btn {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      padding: 0.7rem 1.25rem;
      text-align: left;
      font-family: 'Brans', sans-serif;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8f8f8;
      border: 1px solid rgba(248, 248, 248, 0.15);
      border-radius: 4px;
      background: rgba(248, 248, 248, 0.03);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .links-sub-btn:hover {
      background: rgba(44, 137, 211, 0.14);
      border-color: rgba(44, 137, 211, 0.5);
      color: #f8f8f8;
    }

    .links-sub-btn img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* Newsletter signup */
    .links-signup {
      width: 100%;
      margin-bottom: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .links-signup-title {
      font-family: 'Brans', sans-serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      line-height: 1.1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      color: #f8f8f8;
      margin-bottom: 1.25rem;
    }

    .links-signup-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .links-signup-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      font-family: 'DIN Condensed', Georgia, sans-serif;
      font-size: 1rem;
      color: #f8f8f8;
      background: rgba(248, 248, 248, 0.05);
      border: 1px solid rgba(248, 248, 248, 0.25);
      border-radius: 4px;
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .links-signup-input::placeholder {
      color: rgba(248, 248, 248, 0.45);
    }

    .links-signup-input:focus {
      outline: none;
      border-color: #2C89D3;
      background: rgba(44, 137, 211, 0.08);
    }

    .links-signup-consent {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      cursor: pointer;
      margin: 0.2rem 0 0.3rem;
    }

    .links-signup-consent input[type="checkbox"] {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 0.15rem;
      accent-color: #2C89D3;
      cursor: pointer;
    }

    .links-signup-consent span {
      font-family: 'DIN Condensed', Georgia, sans-serif;
      font-size: 0.85rem;
      line-height: 1.45;
      color: rgba(248, 248, 248, 0.65);
      text-align: left;
    }

    .links-signup-consent a {
      color: #2C89D3;
      text-decoration: underline;
    }

    .links-signup-msg {
      font-family: 'DIN Condensed', Georgia, sans-serif;
      font-size: 0.9rem;
      text-align: center;
      min-height: 1.2em;
      margin: 0;
    }

    /* Social icons */
    .links-socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .links-social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      opacity: 0.6;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .links-social-link:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    .links-social-link img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 768px) {
      body {
        justify-content: center;
      }

      .links-bg-image {
        height: 100vh;
      }
    }

  <script>
    function toggleStreaming(btn) {
      var panel = document.getElementById('streaming-platforms');
      var expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!expanded));
      panel.classList.toggle('open', !expanded);
    }
  </script>
  <script>
  (function () {
    // Las Aguas mailing-list signup — writes into the dashboard's Silver Omen customer list.
    var API_BASE = "https://lasaguasproductions.com";
    var SLUG = "newsletter-sign-up-eyf4";
    var FORM_ID = "3cfde81d-ffdd-487d-8a79-9987756bcf3f";
    var FIELDS = ["email", "name"];

    function sessionToken() {
      try {
        var t = localStorage.getItem("laf_sid");
        if (!t) {
          t = (window.crypto && crypto.randomUUID && crypto.randomUUID())
            || (Date.now() + "-" + Math.random().toString(36).slice(2));
          localStorage.setItem("laf_sid", t);
        }
        return t;
      } catch (e) { return Date.now() + "-" + Math.random().toString(36).slice(2); }
    }
    function readUTM() {
      var p = new URLSearchParams(location.search);
      return {
        source: p.get("utm_source") || undefined, medium: p.get("utm_medium") || undefined,
        campaign: p.get("utm_campaign") || undefined, content: p.get("utm_content") || undefined,
        term: p.get("utm_term") || undefined,
      };
    }
    var TOKEN = sessionToken();

    // Record the pageview for source/referrer/UTM attribution (fire-and-forget).
    fetch(API_BASE + "/api/forms-public/track", {
      method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
      body: JSON.stringify({
        formId: FORM_ID, sessionToken: TOKEN, referrer: document.referrer,
        utm: readUTM(), language: navigator.language,
      }),
    }).catch(function () {});

    var form = document.getElementById("la-signup");
    var msg = form.querySelector(".links-signup-msg");
    var btn = form.querySelector('button[type="submit"]');
    var consent = document.getElementById("la-signup-consent");
    var el = form.elements;

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      if (el.website && el.website.value) return; // honeypot tripped — drop silently

      msg.style.color = "";
      msg.textContent = "";

      if (!consent.checked) {
        msg.style.color = "#ff6b6b";
        msg.textContent = "Please check the box to confirm you'd like to receive emails.";
        return;
      }

      btn.disabled = true;

      var payload = { slug: SLUG, source_path: location.pathname, session_token: TOKEN };
      FIELDS.forEach(function (k) {
        if (el[k] && el[k].value.trim()) payload[k] = el[k].value.trim();
      });

      try {
        var res = await fetch(API_BASE + "/api/forms-public/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong.");
        form.reset();
        msg.style.color = "#6fcf97";
        msg.textContent = data.message || "Thanks — you're signed up!";
      } catch (err) {
        msg.style.color = "#ff6b6b";
        msg.textContent = err.message;
        btn.disabled = false;
      }
    });
  })();
  </script>
