<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="assets/images/Gallery/Silver Omen PFP Orange.jpeg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Privacy Policy | Silver Omen</title>
  <link rel="canonical" href="https://www.silveromen.com/privacy" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/theme-green.css" />
  <style>
    /* ===== Privacy Page ===== */
    .policy-page {
      min-height: 100vh;
      padding: 10rem 3rem 6rem;
    }

    .policy-page-inner {
      max-width: 800px;
      margin: 0 auto;
    }

    .policy-page-header {
      margin-bottom: 3rem;
    }

    .policy-page-title {
      font-family: 'Protagonist', sans-serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.05;
      margin-bottom: 0.75rem;
    }

    .policy-page-updated {
      font-family: 'Brans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9d56da;
    }

    .policy-section {
      margin-bottom: 2.75rem;
    }

    .policy-section-title {
      font-family: 'Protagonist', sans-serif;
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 1rem;
      color: #f8f8f8;
    }

    .policy-section p {
      font-family: 'DIN Condensed', Georgia, sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: rgba(248, 248, 248, 0.8);
      margin-bottom: 1rem;
    }

    .policy-section ul {
      margin: 0 0 1rem 1.25rem;
    }

    .policy-section li {
      font-family: 'DIN Condensed', Georgia, sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: rgba(248, 248, 248, 0.8);
      margin-bottom: 0.5rem;
    }

    .policy-section a {
      color: #9d56da;
      text-decoration: underline;
    }

    .policy-section strong {
      color: #f8f8f8;
    }

    .policy-subtitle {
      font-family: 'Brans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(248, 248, 248, 0.5);
      margin-bottom: 0.6rem;
    }

    @media (max-width: 768px) {
      .policy-page {
        padding: 7rem 1.5rem 4rem;
      }
    }
  </style>
  <!-- Meta Pixel Code -->

  !function(f,b,e,v,n,t,s)

  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];

</head>
<body>
  <div id="root"></div>
  <script src="assets/js/header.js"></script>
  <script src="assets/js/footer.js"></script>
  <script>
    Header.render('#root', '');

    var page =
      '<main class="policy-page">' +
        '<div class="policy-page-inner">' +

          '<div class="policy-page-header">' +
            '<h1 class="policy-page-title">Privacy Policy</h1>' +
            '<span class="policy-page-updated">Last updated August 11, 2026</span>' +
          '</div>' +

          '<div class="policy-section">' +
            '<p>This policy explains what information silveromen.com ("we," "us," "the site") collects, why, and the choices you have. The site is operated on behalf of the artist Silver Omen by Las Aguas Productions. If you have questions, contact us at <a href="mailto:hi@silveromen.com">hi@silveromen.com</a>.</p>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Information We Collect</h2>' +

            '<div class="policy-subtitle">Automatically, as you browse</div>' +
            '<p>We run a first-party analytics system to understand traffic and which links and releases resonate. As you use the site it can collect: the page you’re on, links and buttons you click, how long you stay and how far you scroll, the site that referred you, campaign tags (UTM parameters) in the URL, your browser language, your screen size, and your approximate location (country and city). Location is resolved server-side from your IP address at the moment of your first visit — the IP address itself is used only for that lookup and is never stored. Your full browsing history and precise location are never collected.</p>' +

            '<div class="policy-subtitle">If you pre-save a release</div>' +
            '<p>Pre-saving a release connects your Spotify, Apple Music, or YouTube Music account through that platform’s own sign-in screen. We never see or store your password. Depending on the platform, we receive and store your account email, a platform-issued token that lets us add the release to your library and follow the artist on your behalf on release day, and basic profile identifiers needed to avoid duplicate entries. We request only the permissions needed to save the release and follow the artist — nothing else.</p>' +

            '<div class="policy-subtitle">If you sign up to the mailing list</div>' +
            '<p>If you join the newsletter, we store the email address (and any other field shown on the form) that you submit.</p>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Cookies</h2>' +
            '<p>The banner shown on your first visit lets you choose between two tiers:</p>' +
            '<ul>' +
              '<li><strong>Essential only</strong> — a temporary, session-only identifier (not a cookie) that lets us count a visit and its pageviews/clicks. It clears when you close the tab.</li>' +
              '<li><strong>Accept</strong> — in addition to the above, sets two first-party cookies: <em>so_consent</em>, which remembers your choice for 90 days, and <em>so_ret</em>, which lets us recognize you as a returning visitor for 30 days and unlocks scroll-depth and time-on-page measurement.</li>' +
            '</ul>' +
            '<p>You can withdraw consent at any time by clearing cookies for this site in your browser, which restores the essential-only tier.</p>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Advertising (Meta / Instagram / Facebook)</h2>' +
            '<p>We run advertising campaigns through Meta (Facebook and Instagram), and this site loads the Meta Pixel to support them. The Pixel runs entirely in your browser — we do not use Meta’s server-side Conversions API, so no browsing data is relayed to Meta from our own servers. Instead, the Pixel sends page views and interactions directly from your browser to Meta, which means it is subject to your browser’s tracking protections, ad blockers, and Meta’s own consent tools. We use this data to measure ad performance and to build audiences (such as retargeting site visitors or lookalike audiences) for future campaigns. Meta acts as an independent controller of the data it receives this way; see <a href="https://www.facebook.com/privacy/policy/" target="_blank" rel="noopener noreferrer">Meta’s Privacy Policy</a> for how it handles that data and your controls, including <a href="https://www.facebook.com/login.php?next=https%3A%2F%2Faccountscenter.facebook.com%2Fad_preferences%2F" target="_blank" rel="noopener noreferrer">Ad Preferences</a>.</p>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">How We Use This Information</h2>' +
            '<ul>' +
              '<li>Understand which pages, links, and campaigns drive engagement and releases people care about</li>' +
              '<li>Fulfil pre-save requests — saving music and following the artist on your behalf on release day</li>' +
              '<li>Send updates to fans who opt into the mailing list</li>' +
              '<li>Measure and improve advertising performance</li>' +
              '<li>Keep the site secure and working correctly</li>' +
            '</ul>' +
            '<p>We do not sell your personal information.</p>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Who We Share It With</h2>' +
            '<p>We share information with the service providers that run the site on our behalf, each acting under our instructions:</p>' +
            '<ul>' +
              '<li><strong>Supabase</strong> — hosts our database and the function that receives analytics events and pre-save data</li>' +
              '<li><strong>Vercel</strong> — hosts the website and the pre-save sign-in flow</li>' +
              '<li><strong>Spotify, Apple, and Google (YouTube)</strong> — receive only what’s required to complete a pre-save you initiated</li>' +
              '<li><strong>Meta</strong> — receives browser-side Pixel data as described above, for advertising</li>' +
            '</ul>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Data Retention</h2>' +
            '<p>Analytics events and sessions are kept as long as needed for the purposes above. Pre-save records are kept so the fulfilment can run on release day and so we don’t create duplicate entries for the same fan; you can ask us to delete yours at any time. IP addresses are never stored.</p>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Your Choices</h2>' +
            '<ul>' +
              '<li>Set or change your cookie preference via the consent banner, or by clearing cookies for this site</li>' +
              '<li>Revoke this site’s access to your Spotify, Apple, or Google account at any time from that platform’s own connected-apps settings</li>' +
              '<li>Manage how Meta uses your activity for ads via <a href="https://www.facebook.com/ah/" target="_blank" rel="noopener noreferrer">Ad Preferences</a></li>' +
              '<li>Unsubscribe from the mailing list using the link in any email we send</li>' +
              '<li>Request access to, correction of, or deletion of your information by emailing <a href="mailto:hi@silveromen.com">hi@silveromen.com</a></li>' +
            '</ul>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Children’s Privacy</h2>' +
            '<p>This site is not directed at children under 13, and we do not knowingly collect personal information from them.</p>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Changes to This Policy</h2>' +
            '<p>We may update this policy as the site changes. The date at the top reflects the most recent revision.</p>' +
          '</div>' +

          '<div class="policy-section">' +
            '<h2 class="policy-section-title">Contact</h2>' +
            '<p>Questions about this policy or your data can be sent to <a href="mailto:hi@silveromen.com">hi@silveromen.com</a>.</p>' +
          '</div>' +

        '</div>' +
      '</main>';

    document.getElementById('root').insertAdjacentHTML('beforeend', page);

    Footer.render('#root', '');
    Header.init();
  </script>
  <script src="assets/js/tracker.js"></script>
</body>
</html>
